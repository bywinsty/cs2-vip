name: CSHOST Runtime Validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate the current Core candidate or restore an unfinished overlay
        required: true
        default: validate
        type: choice
        options:
          - validate
          - restore-only
      build_run_id:
        description: Successful Build AMBuild Plugin push run for the current Core tip
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cshost-runtime-test
  cancel-in-progress: false

jobs:
  validation:
    name: Validate on protected CSHOST test server
    if: github.ref_name == 'Core'
    runs-on: [self-hosted, cshost-runtime, ephemeral]
    environment: cshost-runtime-test
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATION_MODE: ${{ inputs.mode }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      CSHOST_API_BASE: ${{ secrets.CSHOST_API_BASE }}
      CSHOST_API_TOKEN: ${{ secrets.CSHOST_API_TOKEN }}
      CSHOST_FTP_HOST: ${{ secrets.CSHOST_FTP_HOST }}
      CSHOST_FTP_PORT: ${{ secrets.CSHOST_FTP_PORT }}
      CSHOST_FTP_USER: ${{ secrets.CSHOST_FTP_USER }}
      CSHOST_FTP_PASSWORD: ${{ secrets.CSHOST_FTP_PASSWORD }}
      CSHOST_FTP_ROOT: ${{ secrets.CSHOST_FTP_ROOT }}
      CSHOST_SENTINEL_SHA256: ${{ secrets.CSHOST_SENTINEL_SHA256 }}
      CSHOST_RUNTIME_NETWORK_PREFLIGHT: passed
      CSHOST_RUNNER_POLICY_ID: cshost-runtime-ephemeral-v1

    steps:
      - name: Checkout current Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify protected execution context
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/Core
          test "${RUNNER_ENVIRONMENT:-}" = self-hosted
          test -n "${RUNNER_NAME:-}"
          test "$CSHOST_RUNTIME_NETWORK_PREFLIGHT" = passed
          test "$CSHOST_RUNNER_POLICY_ID" = cshost-runtime-ephemeral-v1
          core_tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/Core" --jq '.object.sha')"
          test "$GITHUB_SHA" = "$core_tip"
          environment_json="$(gh api "repos/$GITHUB_REPOSITORY/environments/cshost-runtime-test")"
          test "$(jq -r '.can_admins_bypass' <<<"$environment_json")" = false
          reviewer_rule="$(jq -c '.protection_rules[] | select(.type == "required_reviewers")' \
            <<<"$environment_json")"
          test "$(jq -r '.prevent_self_review' <<<"$reviewer_rule")" = true
          test "$(jq -r '.reviewers | length' <<<"$reviewer_rule")" -ge 1
          for name in CSHOST_API_BASE CSHOST_API_TOKEN CSHOST_FTP_HOST CSHOST_FTP_USER \
            CSHOST_FTP_PASSWORD CSHOST_SENTINEL_SHA256; do
            test -n "${!name}"
            echo "::add-mask::${!name}"
          done
          if [[ "$VALIDATION_MODE" = validate ]]; then
            [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          else
            test "$VALIDATION_MODE" = restore-only
          fi

      - name: Test CSHOST validation and attestation contracts
        run: |
          python3 .github/scripts/test_cshost_runtime_validate.py
          python3 .github/scripts/test_verify_runtime_validation.py

      - name: Verify exact Core build run
        if: inputs.mode == 'validate'
        run: |
          set -euo pipefail
          run_json="$(gh run view "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,headSha,headBranch,event,conclusion,workflowName)"
          test "$(jq -r '.databaseId' <<<"$run_json")" = "$BUILD_RUN_ID"
          test "$(jq -r '.headSha' <<<"$run_json")" = "$GITHUB_SHA"
          test "$(jq -r '.headBranch' <<<"$run_json")" = Core
          test "$(jq -r '.event' <<<"$run_json")" = push
          test "$(jq -r '.conclusion' <<<"$run_json")" = success
          test "$(jq -r '.workflowName' <<<"$run_json")" = "Build AMBuild Plugin"

      - name: Download exact Core candidate
        if: inputs.mode == 'validate'
        run: |
          mkdir candidate
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name compile --dir candidate

      - name: Verify candidate subjects and existing attestations
        if: inputs.mode == 'validate'
        run: |
          set -euo pipefail
          expected=$'vip.spdx.json\nvip.zip'
          test "$(find candidate -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
          test "$(find candidate -maxdepth 1 -type f -printf '%f\n' | sort)" = "$expected"
          zip -T candidate/vip.zip
          python3 .github/scripts/verify_spdx_subject.py \
            --archive candidate/vip.zip --sbom candidate/vip.spdx.json
          test "$(jq -r '.packages[] | select(.SPDXID == "SPDXRef-ReleaseArchive") | .versionInfo' \
            candidate/vip.spdx.json)" = "$GITHUB_SHA"
          policy=(--repo "$GITHUB_REPOSITORY" \
            --signer-workflow bywinsty/cs2-vip/.github/workflows/build.yml \
            --source-ref refs/heads/Core --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA")
          gh attestation verify candidate/vip.zip "${policy[@]}"
          gh attestation verify candidate/vip.zip "${policy[@]}" \
            --predicate-type https://spdx.dev/Document/v2.3
          gh attestation verify candidate/vip.spdx.json "${policy[@]}"

      - name: Run fail-closed CSHOST validation
        run: |
          set -euo pipefail
          mkdir -p runtime-validation-output
          command=(python3 .github/scripts/cshost_runtime_validate.py
            --mode "$VALIDATION_MODE"
            --repository "$GITHUB_REPOSITORY"
            --validation-run-id "$GITHUB_RUN_ID"
            --report runtime-validation-output/runtime-validation-v4.json
            --api-base "$CSHOST_API_BASE"
            --api-token "$CSHOST_API_TOKEN"
            --ftp-host "$CSHOST_FTP_HOST"
            --ftp-port "${CSHOST_FTP_PORT:-21}"
            --ftp-user "$CSHOST_FTP_USER"
            --ftp-password "$CSHOST_FTP_PASSWORD"
            --ftp-root "${CSHOST_FTP_ROOT:-.}"
            --sentinel-sha256 "$CSHOST_SENTINEL_SHA256"
            --transport legacy-ftp
            --runner-policy-id "$CSHOST_RUNNER_POLICY_ID"
            --runner-name "${RUNNER_NAME:-unknown}")
          if [[ "$VALIDATION_MODE" = validate ]]; then
            command+=(--artifact-dir candidate --expected-commit "$GITHUB_SHA" --build-run-id "$BUILD_RUN_ID")
          fi
          "${command[@]}"

      - name: Verify completed runtime report
        if: inputs.mode == 'validate'
        run: |
          set -euo pipefail
          archive_sha="$(sha256sum candidate/vip.zip | cut -d' ' -f1)"
          unzip -p candidate/vip.zip addons/vip/vip.so > runtime-validation-output/vip.so
          binary_sha="$(sha256sum runtime-validation-output/vip.so | cut -d' ' -f1)"
          python3 .github/scripts/verify_runtime_validation.py \
            --report runtime-validation-output/runtime-validation-v4.json \
            --expected-commit "$GITHUB_SHA" \
            --expected-build-run-id "$BUILD_RUN_ID" \
            --archive-sha256 "$archive_sha" \
            --binary-sha256 "$binary_sha" \
            --max-age-hours 24
          cp candidate/vip.zip runtime-validation-output/vip.zip

      - name: Upload validation subject and predicate
        if: inputs.mode == 'validate'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-validation-result
          path: |
            runtime-validation-output/vip.zip
            runtime-validation-output/runtime-validation-v4.json
          if-no-files-found: error
          retention-days: 2

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-validation-report-${{ github.run_id }}
          path: runtime-validation-output/runtime-validation-v4.json
          if-no-files-found: warn
          retention-days: 7

  attestation:
    name: Attest successful runtime validation
    if: inputs.mode == 'validate' && needs.validation.result == 'success'
    needs: validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout current Core verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download validated subject and predicate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: runtime-validation-result
          path: validated

      - name: Re-verify predicate without CSHOST secrets
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          test "$(find validated -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
          archive_sha="$(sha256sum validated/vip.zip | cut -d' ' -f1)"
          unzip -p validated/vip.zip addons/vip/vip.so > validated/vip.so
          binary_sha="$(sha256sum validated/vip.so | cut -d' ' -f1)"
          python3 .github/scripts/verify_runtime_validation.py \
            --report validated/runtime-validation-v4.json \
            --expected-commit "$GITHUB_SHA" \
            --expected-build-run-id "$BUILD_RUN_ID" \
            --archive-sha256 "$archive_sha" \
            --binary-sha256 "$binary_sha" \
            --max-age-hours 24
          rm validated/vip.so

      - name: Attest runtime-validated candidate
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: validated/vip.zip
          predicate-type: https://github.com/bywinsty/cs2-vip/runtime-validation/v4
          predicate-path: validated/runtime-validation-v4.json
